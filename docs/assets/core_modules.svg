<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Core Module Architecture</title>
  <desc id="desc">A hub-and-spoke core module architecture diagram for the QTrobot health education assistant.</desc>
  <defs>
    <pattern id="gridSmall" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#e8eef1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#142c34" flood-opacity="0.11"/>
    </filter>
    <style>
      .section {
        font-family: Inter, Arial, sans-serif;
        font-size: 20px;
        font-weight: 850;
        letter-spacing: 1.4px;
        fill: #70838c;
      }
      .hubTitle {
        font-family: Inter, Arial, sans-serif;
        font-size: 30px;
        font-weight: 850;
        fill: #ffffff;
      }
      .hubSub {
        font-family: Inter, Arial, sans-serif;
        font-size: 15px;
        font-weight: 720;
        fill: #b9ebe7;
      }
      .label {
        font-family: Inter, Arial, sans-serif;
        font-size: 22px;
        font-weight: 850;
        fill: #172930;
      }
      .sub {
        font-family: Inter, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #647780;
      }
      .card {
        fill: #ffffff;
        stroke: #d6e5e9;
        stroke-width: 2.6;
        filter: url(#shadow);
      }
      .hub {
        fill: #0d3033;
        stroke: #087d7a;
        stroke-width: 3.4;
        filter: url(#shadow);
      }
      .link {
        fill: none;
        stroke: #87c9c6;
        stroke-width: 4;
        stroke-linecap: round;
      }
      .dark, .teal, .blue, .red, .purple, .orange {
        fill: none;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dark { stroke: #172930; }
      .teal { stroke: #087d7a; }
      .blue { stroke: #3a7bd5; }
      .red { stroke: #ef5555; }
      .purple { stroke: #7b5fd1; }
      .orange { stroke: #f2a541; }
      .softTeal { fill: #eefbf9; }
      .softBlue { fill: #edf5ff; }
      .softRed { fill: #fff4f4; }
      .softPurple { fill: #f4efff; }
      .softOrange { fill: #fff7e8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f9fcfd"/>
  <rect width="1600" height="900" fill="url(#gridSmall)" opacity="0.58"/>

  <text class="section" x="800" y="88" text-anchor="middle">IMPLEMENTATION MODULES</text>

  <!-- Links behind cards -->
  <path class="link" d="M660 390L500 220"/>
  <path class="link" d="M800 355L800 220"/>
  <path class="link" d="M940 390L1100 220"/>
  <path class="link" d="M660 510L500 680"/>
  <path class="link" d="M800 545L800 680"/>
  <path class="link" d="M940 510L1100 680"/>

  <!-- Central hub -->
  <rect class="hub" x="610" y="340" width="380" height="220" rx="36"/>
  <g transform="translate(728 374) scale(0.72)" opacity="0.16">
    <path d="M18 25H88C122 25 122 82 88 82H18" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 82L43 57M18 82L43 107" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 25H137V62M110 82H137V119M110 139H137V119" fill="none" stroke="#c9f7f2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="hubTitle" x="800" y="434" text-anchor="middle">QTrobot Runtime</text>
  <text class="hubSub" x="800" y="470" text-anchor="middle">integrated AI, ROS, and ECG services</text>

  <!-- AI Dialogue -->
  <rect class="card" x="235" y="145" width="340" height="150" rx="28"/>
  <g transform="translate(286 184) scale(0.72)">
    <circle cx="24" cy="22" r="13" class="softPurple" stroke="#7b5fd1" stroke-width="5"/>
    <circle cx="88" cy="22" r="13" class="softPurple" stroke="#7b5fd1" stroke-width="5"/>
    <circle cx="56" cy="66" r="15" class="softPurple" stroke="#7b5fd1" stroke-width="5"/>
    <circle cx="24" cy="110" r="13" class="softPurple" stroke="#7b5fd1" stroke-width="5"/>
    <circle cx="88" cy="110" r="13" class="softPurple" stroke="#7b5fd1" stroke-width="5"/>
    <path d="M35 30L47 52M77 30L65 52M47 80L35 102M65 80L77 102M37 22H75M37 110H75" class="purple" stroke-width="5"/>
  </g>
  <text class="label" x="460" y="205" text-anchor="middle">LangGraph</text>
  <text class="sub" x="460" y="234" text-anchor="middle">state decisions</text>

  <!-- Medical Safety -->
  <rect class="card" x="630" y="145" width="340" height="150" rx="28"/>
  <g transform="translate(679 177) scale(0.46)">
    <path d="M82 0L154 30V84C154 130 121 162 82 181C43 162 10 130 10 84V30Z" class="softBlue" stroke="#3a7bd5" stroke-width="7" stroke-linejoin="round"/>
    <path d="M47 90L73 116L121 63" class="blue"/>
  </g>
  <text class="label" x="860" y="205" text-anchor="middle">Medical Guard</text>
  <text class="sub" x="860" y="234" text-anchor="middle">risk policy</text>

  <!-- ROS Control -->
  <rect class="card" x="1025" y="145" width="340" height="150" rx="28"/>
  <g transform="translate(1058 190) scale(0.50)">
    <rect x="0" y="24" width="62" height="50" rx="12" class="softTeal" stroke="#087d7a" stroke-width="5"/>
    <rect x="104" y="24" width="62" height="50" rx="12" class="softTeal" stroke="#087d7a" stroke-width="5"/>
    <path d="M62 49H104M78 33L96 49L78 65" class="teal" stroke-width="5"/>
    <circle cx="20" cy="49" r="5" fill="#087d7a"/>
    <circle cx="42" cy="49" r="5" fill="#087d7a"/>
    <circle cx="124" cy="49" r="5" fill="#087d7a"/>
    <circle cx="146" cy="49" r="5" fill="#087d7a"/>
  </g>
  <text class="label" x="1278" y="205" text-anchor="middle">ROS-ZMQ</text>
  <text class="sub" x="1278" y="234" text-anchor="middle">bridge dispatch</text>

  <!-- Speech Recognition -->
  <rect class="card" x="235" y="605" width="340" height="150" rx="28"/>
  <g transform="translate(270 630) scale(0.62)">
    <rect x="0" y="20" width="130" height="76" rx="14" class="softTeal" stroke="#087d7a" stroke-width="5"/>
    <path d="M20 58H35L43 40L58 78L70 58H86L94 48L110 48" class="teal" stroke-width="5"/>
    <path d="M22 8V20M46 8V20M70 8V20M94 8V20M22 96V108M46 96V108M70 96V108M94 96V108" class="teal" stroke-width="4"/>
  </g>
  <text class="label" x="468" y="666" text-anchor="middle">Riva ASR Node</text>
  <text class="sub" x="468" y="695" text-anchor="middle">speech-to-text</text>

  <!-- ECG Layer -->
  <rect class="card" x="630" y="605" width="340" height="150" rx="28"/>
  <g transform="translate(678 634) scale(0.62)">
    <rect x="0" y="14" width="132" height="84" rx="15" class="softRed" stroke="#ef5555" stroke-width="5"/>
    <path d="M16 59H38L48 39L64 82L78 59H112" class="red" stroke-width="5"/>
    <path d="M18 100H114" class="red" stroke-width="4" opacity="0.55"/>
    <circle cx="38" cy="59" r="4" fill="#ef5555"/>
    <circle cx="78" cy="59" r="4" fill="#ef5555"/>
  </g>
  <text class="label" x="865" y="666" text-anchor="middle">ECG Processor</text>
  <text class="sub" x="865" y="695" text-anchor="middle">R peaks + HRV</text>

  <!-- YBC Model -->
  <rect class="card" x="1025" y="605" width="340" height="150" rx="28"/>
  <g transform="translate(1082 640) scale(0.52)">
    <circle cx="30" cy="30" r="14" class="softOrange" stroke="#f2a541" stroke-width="6"/>
    <circle cx="118" cy="30" r="14" class="softOrange" stroke="#f2a541" stroke-width="6"/>
    <circle cx="74" cy="78" r="16" class="softOrange" stroke="#f2a541" stroke-width="6"/>
    <circle cx="30" cy="126" r="14" class="softOrange" stroke="#f2a541" stroke-width="6"/>
    <circle cx="118" cy="126" r="14" class="softOrange" stroke="#f2a541" stroke-width="6"/>
    <path d="M43 38L62 64M105 38L86 64M62 92L43 118M86 92L105 118M46 30H102M46 126H102" class="orange"/>
  </g>
  <text class="label" x="1260" y="666" text-anchor="middle">YBC Classifier</text>
  <text class="sub" x="1260" y="695" text-anchor="middle">N/S/V/F/Q beats</text>
</svg>
