<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QTrobot ECG Monitor</title>
    <style>
        :root {
            --ui-scale: 1;
            --outer-gap: calc(8px * var(--ui-scale));
            --radius: calc(8px * var(--ui-scale));
            --metrics-h: calc(112px * var(--ui-scale));
            --screening-h: calc(44px * var(--ui-scale));
            --status-h: calc(36px * var(--ui-scale));
            --metric-pad-y: calc(12px * var(--ui-scale));
            --metric-pad-x: calc(16px * var(--ui-scale));
            --label-size: calc(15px * var(--ui-scale));
            --value-size: calc(32px * var(--ui-scale));
            --unit-size: calc(17px * var(--ui-scale));
            --hrv-label-size: calc(14px * var(--ui-scale));
            --hrv-value-size: calc(21px * var(--ui-scale));
            --screening-size: calc(14px * var(--ui-scale));
            --screening-value-size: calc(18px * var(--ui-scale));
            --status-size: calc(14px * var(--ui-scale));
            --wave-padding: calc(22px * var(--ui-scale));
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #07110d;
            color: #f3f7f4;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1.05fr 1.65fr 1.55fr 1.15fr;
            height: var(--metrics-h);
            border: 1px solid #26352f;
            border-radius: var(--radius);
            margin: var(--outer-gap);
            overflow: hidden;
            background: #111a16;
            flex: 0 0 auto;
        }

        .metric {
            padding: var(--metric-pad-y) var(--metric-pad-x);
            border-right: 1px solid #26352f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .metric:last-child {
            border-right: 0;
        }

        .label {
            color: #8e9994;
            font-size: var(--label-size);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: calc(5px * var(--ui-scale));
            white-space: nowrap;
        }

        .value {
            color: #f4f7f5;
            font-size: var(--value-size);
            font-weight: 800;
            line-height: 1.05;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .value.accent {
            color: #ffcf6b;
        }

        .value.good {
            color: #47df8a;
        }

        .value.warn {
            color: #ffcf6b;
        }

        .value.bad {
            color: #ff6666;
        }

        .bpm-unit {
            color: #8e9994;
            font-size: var(--unit-size);
            margin-left: calc(5px * var(--ui-scale));
        }

        .hrv {
            display: flex;
            gap: calc(10px * var(--ui-scale));
            align-items: baseline;
            flex-wrap: wrap;
        }

        .hrv span {
            color: #8e9994;
            font-size: var(--hrv-label-size);
            font-weight: 400;
        }

        .hrv strong {
            color: #f4f7f5;
            font-size: var(--hrv-value-size);
            margin-left: calc(4px * var(--ui-scale));
        }

        .screening {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: calc(12px * var(--ui-scale));
            align-items: center;
            height: var(--screening-h);
            border-top: 1px solid #26352f;
            border-bottom: 1px solid #26352f;
            margin: 0 var(--outer-gap);
            padding: 0 calc(12px * var(--ui-scale));
            color: #8e9994;
            font-size: var(--screening-size);
            font-weight: 800;
            text-transform: uppercase;
            flex: 0 0 auto;
        }

        .screening strong {
            color: #ffcf6b;
            font-size: var(--screening-value-size);
            margin-left: calc(8px * var(--ui-scale));
        }

        .status {
            height: var(--status-h);
            display: flex;
            align-items: center;
            gap: calc(8px * var(--ui-scale));
            padding: 0 var(--outer-gap);
            color: #98a39f;
            font-size: var(--status-size);
            font-weight: 800;
            text-transform: uppercase;
            flex: 0 0 auto;
        }

        .dot {
            width: calc(8px * var(--ui-scale));
            height: calc(8px * var(--ui-scale));
            border-radius: 999px;
            background: #6f7b76;
            flex: 0 0 auto;
        }

        .dot.live {
            background: #35e783;
            box-shadow: 0 0 14px rgba(53, 231, 131, 0.7);
        }

        .plot {
            position: relative;
            flex: 1;
            margin: 0 var(--outer-gap) var(--outer-gap);
            min-height: 0;
            border: 1px solid #26352f;
            border-radius: var(--radius);
            overflow: hidden;
            background: #07110d;
        }

        .plot-debug {
            position: absolute;
            left: calc(12px * var(--ui-scale));
            top: calc(10px * var(--ui-scale));
            z-index: 3;
            color: rgba(152, 163, 159, 0.72);
            font-size: calc(12px * var(--ui-scale));
            font-weight: 700;
            pointer-events: none;
            text-transform: uppercase;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        @media (max-width: 900px) {
            .metrics {
                grid-template-columns: 1fr 1fr;
                height: calc(var(--metrics-h) * 1.55);
            }

            .metric:nth-child(2) {
                border-right: 0;
            }

            .metric:nth-child(1),
            .metric:nth-child(2) {
                border-bottom: 1px solid #26352f;
            }

            .value {
                font-size: calc(var(--value-size) * 0.85);
            }

            .screening {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <section class="metrics">
        <div class="metric">
            <div class="label">Heart Rate</div>
            <div class="value"><span id="bpmDisplay">--</span><span class="bpm-unit">BPM</span></div>
        </div>
        <div class="metric">
            <div class="label">Rhythm</div>
            <div class="value accent" id="rhythmDisplay">Connecting</div>
        </div>
        <div class="metric">
            <div class="label">Signal</div>
            <div class="value" id="qualityDisplay">Connecting</div>
        </div>
        <div class="metric">
            <div class="label">HRV</div>
            <div class="hrv">
                <span>RMSSD <strong id="rmssdDisplay">--</strong></span>
                <span>pNN50 <strong id="pnn50Display">--</strong></span>
            </div>
        </div>
    </section>

    <section class="screening">
        <div>R Peaks <strong id="rPeakDisplay">--</strong></div>
        <div>Valid RR <strong id="validRrDisplay">--</strong></div>
        <div>YBC Abnormal <strong id="ybcAbnormalDisplay">--</strong></div>
        <div>YBC Result <strong id="ybcResultDisplay">--</strong></div>
    </section>

    <section class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusLabel">Connecting to ECG device</span>
    </section>

    <section class="plot">
        <canvas id="gridCanvas"></canvas>
        <canvas id="ecgCanvas"></canvas>
        <div class="plot-debug" id="plotDebug">samples=0 | stream=connecting</div>
    </section>

    <script>
        const DATABASE_URL = "https://ecg-monitor-bf64d-default-rtdb.firebaseio.com";
        const DEVICE_PATH = "devices/yuguard_01";
        const STREAM_URL = `${DATABASE_URL}/${DEVICE_PATH}/stream.json`;
        const ANALYSIS_URL = `${DATABASE_URL}/${DEVICE_PATH}/analysis.json`;
        const SAMPLE_RATE = 375;
        const WINDOW_SECONDS = 5;
        const MAX_POINTS = SAMPLE_RATE * WINDOW_SECONDS;

        const gridCanvas = document.getElementById("gridCanvas");
        const gridCtx = gridCanvas.getContext("2d", { alpha: false });
        const ecgCanvas = document.getElementById("ecgCanvas");
        const ecgCtx = ecgCanvas.getContext("2d");
        const dataBuffer = new Float64Array(MAX_POINTS);

        let totalSamplesReceived = 0;
        let lastPacketId = "";
        let lastStreamAt = 0;
        let waveCenter = 0.02;
        let waveRange = 0.22;
        let absolutePeaks = [];
        let bpmHistory = [];

        const bpmDisplay = document.getElementById("bpmDisplay");
        const rhythmDisplay = document.getElementById("rhythmDisplay");
        const qualityDisplay = document.getElementById("qualityDisplay");
        const rmssdDisplay = document.getElementById("rmssdDisplay");
        const pnn50Display = document.getElementById("pnn50Display");
        const rPeakDisplay = document.getElementById("rPeakDisplay");
        const validRrDisplay = document.getElementById("validRrDisplay");
        const ybcAbnormalDisplay = document.getElementById("ybcAbnormalDisplay");
        const ybcResultDisplay = document.getElementById("ybcResultDisplay");
        const statusLabel = document.getElementById("statusLabel");
        const statusDot = document.getElementById("statusDot");
        const plotDebug = document.getElementById("plotDebug");

        function setStatus(text, live = false) {
            statusLabel.textContent = text;
            statusDot.classList.toggle("live", live);
        }

        function setTone(el, tone) {
            el.classList.remove("good", "warn", "bad", "accent");
            if (tone) el.classList.add(tone);
        }

        function normalizeScore(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number.toFixed(3) : "--";
        }

        function updatePlotDebug(state = "") {
            const age = lastStreamAt ? ((Date.now() - lastStreamAt) / 1000).toFixed(1) : "--";
            plotDebug.textContent = `samples=${totalSamplesReceived} | last=${age}s | ${state}`;
        }

        function appendSamples(samples) {
            for (const raw of samples) {
                const value = Number(raw);
                if (!Number.isFinite(value)) continue;
                dataBuffer.copyWithin(0, 1);
                dataBuffer[MAX_POINTS - 1] = value;
                totalSamplesReceived += 1;
            }
            if (samples.length) lastStreamAt = Date.now();
        }

        function numericArrayFrom(value) {
            if (Array.isArray(value)) return value;
            if (!value || typeof value !== "object") return null;
            const keys = Object.keys(value);
            if (!keys.length || !keys.every((key) => /^\d+$/.test(key))) return null;
            return keys.sort((a, b) => Number(a) - Number(b)).map((key) => value[key]);
        }

        function extractPacket(firebaseEvent) {
            if (!firebaseEvent || firebaseEvent.data == null) return null;
            const data = firebaseEvent.data;
            const directArray = numericArrayFrom(data);
            if (directArray) return { batch: directArray, id: JSON.stringify([firebaseEvent.path, directArray.length, directArray[0], directArray[directArray.length - 1]]) };
            if (typeof data !== "object") return null;
            const batch = numericArrayFrom(data.batch) || numericArrayFrom(data.stream) || numericArrayFrom(data.data);
            if (!batch) return null;
            const id = data.session_id != null && data.sequence != null
                ? `${data.session_id}:${data.sequence}`
                : JSON.stringify([firebaseEvent.path, batch.length, batch[0], batch[batch.length - 1]]);
            return { batch, id };
        }

        function connectStream() {
            const source = new EventSource(STREAM_URL);
            source.onopen = () => setStatus("Connected to ECG cloud stream", true);
            source.onerror = () => {
                setStatus("Reconnecting to ECG cloud stream", false);
                updatePlotDebug("stream=reconnecting");
            };
            const handleStreamEvent = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    const packet = extractPacket(payload);
                    if (!packet) {
                        updatePlotDebug(`event=${event.type} no-batch`);
                        return;
                    }
                    if (packet.id === lastPacketId) return;
                    lastPacketId = packet.id;
                    appendSamples(packet.batch);
                    detectRPeaks();
                    updateLiveMetrics();
                    updatePlotDebug(`event=${event.type}`);
                } catch (error) {
                    setStatus("ECG stream parse error", false);
                    updatePlotDebug(`parse-error=${event.type}`);
                }
            };
            source.onmessage = handleStreamEvent;
            source.addEventListener("put", handleStreamEvent);
            source.addEventListener("patch", handleStreamEvent);
        }

        function connectAnalysis() {
            const source = new EventSource(ANALYSIS_URL);
            const handleAnalysisEvent = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    const analysis = payload && payload.data;
                    if (analysis) updateAnalysis(analysis);
                } catch (error) {
                    // Keep live waveform visible even if analysis metadata is unavailable.
                }
            };
            source.onmessage = handleAnalysisEvent;
            source.addEventListener("put", handleAnalysisEvent);
            source.addEventListener("patch", handleAnalysisEvent);
        }

        function updateAnalysis(snapshot) {
            const status = snapshot.status || "";
            const metrics = snapshot.metrics || {};
            const analysis = snapshot.arrhythmia_analysis || {};
            const modelArrhythmia = snapshot.model_arrhythmia || {};
            const quality = analysis.signal_quality || {};

            if (Number.isFinite(Number(metrics.bpm))) bpmDisplay.textContent = Number(metrics.bpm).toFixed(1);
            if (Number.isFinite(Number(metrics.rmssd_ms))) rmssdDisplay.textContent = `${Number(metrics.rmssd_ms).toFixed(1)}ms`;
            if (Number.isFinite(Number(metrics.pnn50_percent))) pnn50Display.textContent = `${Number(metrics.pnn50_percent).toFixed(1)}%`;

            rPeakDisplay.textContent = Number.isFinite(Number(metrics.r_peak_count))
                ? String(metrics.r_peak_count)
                : "--";
            validRrDisplay.textContent = Number.isFinite(Number(metrics.valid_rr_count))
                ? String(metrics.valid_rr_count)
                : "--";
            if (modelArrhythmia.status === "complete") {
                const abnormalPercent = Number(modelArrhythmia.abnormal_beat_percent || 0);
                const labels = modelArrhythmia.abnormal_labels || [];
                ybcAbnormalDisplay.textContent = `${abnormalPercent.toFixed(1)}%`;
                ybcResultDisplay.textContent = modelArrhythmia.arrhythmia_detected
                    ? (labels.length ? labels.join("/") : "ABNORMAL")
                    : "OK";
            } else if (modelArrhythmia.status) {
                ybcAbnormalDisplay.textContent = "--";
                ybcResultDisplay.textContent = String(modelArrhythmia.status).replaceAll("_", " ").toUpperCase();
            } else {
                ybcAbnormalDisplay.textContent = "--";
                ybcResultDisplay.textContent = "--";
            }

            if (quality.label) {
                qualityDisplay.textContent = String(quality.label).toUpperCase();
                setTone(qualityDisplay, quality.label === "good" ? "good" : quality.label === "poor" ? "bad" : "warn");
            }

            if (status === "waiting_device") {
                rhythmDisplay.textContent = "Waiting";
                setTone(rhythmDisplay, "warn");
                setStatus("Waiting for ECG device", false);
            } else if (status === "waiting_signal") {
                rhythmDisplay.textContent = "Detecting";
                setTone(rhythmDisplay, "warn");
                setStatus("Validating ECG quality", true);
            } else if (status === "measuring") {
                rhythmDisplay.textContent = "Measuring";
                setTone(rhythmDisplay, "accent");
                setStatus("60-second ECG measurement in progress", true);
            } else if (status === "complete") {
                if (modelArrhythmia.status === "complete") {
                    rhythmDisplay.textContent = modelArrhythmia.arrhythmia_detected ? "YBC ABNORMAL" : "YBC OK";
                    setTone(rhythmDisplay, modelArrhythmia.arrhythmia_detected ? "warn" : "good");
                } else {
                    rhythmDisplay.textContent = "SCREENING";
                    setTone(rhythmDisplay, "warn");
                }
                setStatus("Measurement complete", false);
            } else if (status === "signal_timeout" || status === "stream_lost") {
                rhythmDisplay.textContent = "Retry";
                qualityDisplay.textContent = "LOW";
                setTone(rhythmDisplay, "bad");
                setTone(qualityDisplay, "bad");
                setStatus(status.replaceAll("_", " "), false);
            }
        }

        function detectRPeaks() {
            const n = dataBuffer.length;
            const diff = new Float64Array(n);
            const squared = new Float64Array(n);
            for (let i = 1; i < n; i++) {
                diff[i] = dataBuffer[i] - dataBuffer[i - 1];
                squared[i] = diff[i] * diff[i];
            }
            const winSize = Math.max(1, Math.round(SAMPLE_RATE * 0.08));
            const integrated = new Float64Array(n);
            let sum = 0;
            for (let i = 0; i < n; i++) {
                sum += squared[i];
                if (i >= winSize) sum -= squared[i - winSize];
                integrated[i] = sum / winSize;
            }
            const finite = Array.from(integrated).filter(Number.isFinite).sort((a, b) => a - b);
            if (!finite.length) return;
            const reference = finite[Math.floor(finite.length * 0.99)];
            if (!Number.isFinite(reference) || reference <= 0) return;

            const threshold = reference * 0.35;
            const distance = Math.round(SAMPLE_RATE * 0.3);
            const searchRadius = Math.round(SAMPLE_RATE * 0.06);
            const localPeaks = [];
            let lastPeak = -distance;
            for (let i = 1; i < n - 1; i++) {
                if (integrated[i] < threshold || integrated[i] < integrated[i - 1] || integrated[i] < integrated[i + 1]) continue;
                if (i - lastPeak < distance) continue;
                const start = Math.max(0, i - searchRadius);
                const end = Math.min(n, i + searchRadius + 1);
                let maxValue = -Infinity;
                let maxIndex = i;
                for (let j = start; j < end; j++) {
                    if (dataBuffer[j] > maxValue) {
                        maxValue = dataBuffer[j];
                        maxIndex = j;
                    }
                }
                localPeaks.push(maxIndex);
                lastPeak = i;
            }

            const bufferStartAbs = totalSamplesReceived - n;
            absolutePeaks = localPeaks.map((idx) => bufferStartAbs + idx).filter((idx) => idx > bufferStartAbs);
        }

        function updateLiveMetrics() {
            if (absolutePeaks.length < 3) return;
            const rr = [];
            for (let i = 1; i < absolutePeaks.length; i++) {
                const rrMs = (absolutePeaks[i] - absolutePeaks[i - 1]) / SAMPLE_RATE * 1000;
                if (rrMs >= 300 && rrMs <= 2000) rr.push(rrMs);
            }
            if (rr.length < 2) return;
            const recent = rr.slice(-5).sort((a, b) => a - b);
            const medianRR = recent[Math.floor(recent.length / 2)];
            const bpm = 60000 / medianRR;
            bpmHistory.push(bpm);
            if (bpmHistory.length > 8) bpmHistory.shift();
            const sortedBpm = [...bpmHistory].sort((a, b) => a - b);
            bpmDisplay.textContent = sortedBpm[Math.floor(sortedBpm.length / 2)].toFixed(0);

            const diffs = rr.slice(1).map((v, i) => v - rr[i]);
            if (diffs.length) {
                const rmssd = Math.sqrt(diffs.reduce((acc, v) => acc + v * v, 0) / diffs.length);
                const pnn50 = diffs.filter((v) => Math.abs(v) > 50).length / diffs.length * 100;
                rmssdDisplay.textContent = `${rmssd.toFixed(1)}ms`;
                pnn50Display.textContent = `${pnn50.toFixed(1)}%`;
            }
        }

        function updateResponsiveScale() {
            const width = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1280);
            const height = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 720);
            const baseChromeHeight = 112 + 44 + 36 + 32;
            const maxChromeHeight = height * 0.38;
            const viewportScale = Math.min(width / 1280, height / 720);
            const chromeScale = maxChromeHeight / baseChromeHeight;
            const scale = Math.max(0.68, Math.min(1.28, viewportScale, chromeScale));
            document.documentElement.style.setProperty("--ui-scale", scale.toFixed(3));
        }

        function cssNumber(name, fallback) {
            const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            const value = Number.parseFloat(raw);
            return Number.isFinite(value) ? value : fallback;
        }

        function resize() {
            updateResponsiveScale();
            const rect = ecgCanvas.parentElement.getBoundingClientRect();
            const width = Math.max(1, Math.floor(rect.width));
            const height = Math.max(1, Math.floor(rect.height));
            for (const c of [gridCanvas, ecgCanvas]) {
                c.width = width;
                c.height = height;
            }
            drawGrid();
        }

        function drawGrid() {
            gridCtx.fillStyle = "#07110d";
            gridCtx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);
            gridCtx.strokeStyle = "rgba(255,255,255,0.06)";
            gridCtx.lineWidth = 1;
            const small = 48;
            for (let x = 0; x <= gridCanvas.width; x += small) {
                gridCtx.beginPath();
                gridCtx.moveTo(x, 0);
                gridCtx.lineTo(x, gridCanvas.height);
                gridCtx.stroke();
            }
            for (let y = 0; y <= gridCanvas.height; y += small) {
                gridCtx.beginPath();
                gridCtx.moveTo(0, y);
                gridCtx.lineTo(gridCanvas.width, y);
                gridCtx.stroke();
            }
            gridCtx.strokeStyle = "rgba(66,232,139,0.18)";
            gridCtx.beginPath();
            gridCtx.moveTo(0, gridCanvas.height / 2);
            gridCtx.lineTo(gridCanvas.width, gridCanvas.height / 2);
            gridCtx.stroke();
        }

        function toYFactory() {
            const values = [];
            for (let i = 0; i < dataBuffer.length; i++) {
                const value = dataBuffer[i];
                if (Number.isFinite(value) && Math.abs(value) > 1e-9) values.push(value);
            }
            if (values.length >= 12) {
                values.sort((a, b) => a - b);
                const low = values[Math.floor(values.length * 0.02)];
                const high = values[Math.floor(values.length * 0.98)];
                const targetCenter = (low + high) / 2;
                const targetRange = Math.max((high - low) * 1.9, 0.20);
                waveCenter = waveCenter * 0.985 + targetCenter * 0.015;
                waveRange = waveRange * 0.94 + targetRange * 0.06;
            }
            if (!Number.isFinite(waveCenter) || !Number.isFinite(waveRange) || waveRange <= 0) {
                waveCenter = 0.02;
                waveRange = 0.22;
            }
            const padding = 22 * cssNumber("--ui-scale", 1);
            const drawableHeight = Math.max(1, ecgCanvas.height - padding * 2);
            const range = Math.max(waveRange, 0.18);
            const top = waveCenter + range / 2;
            return (value) => {
                if (!Number.isFinite(value)) return ecgCanvas.height / 2;
                const y = padding + ((top - value) / range) * drawableHeight;
                return Math.max(padding, Math.min(ecgCanvas.height - padding, y));
            };
        }

        function drawECG() {
            ecgCtx.clearRect(0, 0, ecgCanvas.width, ecgCanvas.height);
            const toY = toYFactory();
            const xStep = ecgCanvas.width / Math.max(1, MAX_POINTS - 1);
            ecgCtx.beginPath();
            let started = false;
            for (let i = 0; i < MAX_POINTS; i++) {
                const value = dataBuffer[i];
                if (!Number.isFinite(value)) continue;
                const x = i * xStep;
                const y = toY(value);
                if (!started) {
                    ecgCtx.moveTo(x, y);
                    started = true;
                } else {
                    ecgCtx.lineTo(x, y);
                }
            }
            if (started) {
                ecgCtx.strokeStyle = "#42e88b";
                ecgCtx.lineWidth = 2;
                ecgCtx.stroke();
            }

            const bufferStartAbs = totalSamplesReceived - MAX_POINTS;
            ecgCtx.fillStyle = "#ff5d66";
            for (const absIdx of absolutePeaks) {
                const localIdx = absIdx - bufferStartAbs;
                if (localIdx < 0 || localIdx >= MAX_POINTS) continue;
                ecgCtx.beginPath();
                ecgCtx.arc(localIdx * xStep, toY(dataBuffer[localIdx]), 5, 0, Math.PI * 2);
                ecgCtx.fill();
            }

            if (lastStreamAt && Date.now() - lastStreamAt > 5000) {
                setStatus("Waiting for fresh ECG samples", false);
                updatePlotDebug("stream=stale");
            }
            requestAnimationFrame(drawECG);
        }

        window.addEventListener("resize", resize);
        resize();
        connectStream();
        connectAnalysis();
